services:
  postgres:
    image: postgres:14.6
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - app-network

  auth-api:
    build:
      context: ./auth-api
    container_name: auth-api
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - app-network

  data-api:
    build:
      context: ./data-api
    container_name: data-api
    environment:
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
    ports:
      - "8081:8081"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge